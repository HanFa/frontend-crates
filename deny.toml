[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost Software License (xxhash-rust, the XXH3 crate Dynamo's canonical
    # media identity uses).
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

# Existing Dynamo bindings to consumer-provided shared FFmpeg, not FFmpeg's
# native license. Keep these exceptions scoped to the two binding crates.
[[licenses.exceptions]]
name = "ffmpeg-next"
allow = ["WTFPL"]

[[licenses.exceptions]]
name = "ffmpeg-sys-next"
allow = ["WTFPL"]
