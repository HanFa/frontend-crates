[package]
name = "dynamo-multimodal"
readme = "README.md"
version = "0.1.0"
edition.workspace = true
description = "Shared multimodal input processing, prompt geometry, token accounting, and content identity for LLM inference serving."
authors.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
keywords = ["llm", "multimodal", "vision", "preprocessing", "inference"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE", "NOTICE*", "build-ffmpeg.sh", "tests/**"]

[features]
default = ["parallel"]
# Trusted-source compatibility helper (data:/base64/file/http), not an
# untrusted URL security boundary. Still a stub; its implementation wires the
# deps: `fetch = ["dep:ureq", "dep:base64"]`.
fetch = []
# Links rayon; kernels still run inline until `execution::init_pool` arms the
# crate-owned pool at runtime. Opt out (`default-features = false`) to drop
# rayon from the dependency graph and force the inline path at compile time.
parallel = ["dep:rayon"]

# Dynamo-compatible channel preservation, limits, and optional system JPEG.
media-decode = ["dep:anyhow", "dep:libloading", "image/default-formats"]
# Linux video decoding against shared system FFmpeg, never a vendored build.
video = ["dep:anyhow", "dep:ffmpeg-next", "dep:video-rs", "dep:memfile", "dep:tracing"]

[dependencies]
anyhow = { workspace = true, optional = true }
libloading = { version = "0.8", optional = true }
ffmpeg-next = { version = "=9.0.0", optional = true }
video-rs = { version = "0.12.0", optional = true }
memfile = { version = "0.3.2", optional = true }
tracing = { workspace = true, optional = true }
blake3.workspace = true
gif.workspace = true
image.workspace = true
rayon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
turbojpeg.workspace = true
xxhash-rust.workspace = true

[dev-dependencies]
base64.workspace = true
